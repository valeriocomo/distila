<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Distila</title>
<style>
  :root {
    color-scheme: light dark;
  }
  /* Side panel: fill the panel height, the output area takes the rest */
  body {
    box-sizing: border-box;
    height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 12px;
    margin: 0;
  }
  /* Popup fallback (sidepanel.html?mode=popup): popups size to their content */
  body.popup {
    box-sizing: content-box;
    width: 360px;
    height: auto;
    display: block;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 10px;
  }
  .row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  select {
    flex: 1;
    padding: 4px;
    font-size: 12px;
  }
  button {
    width: 100%;
    padding: 8px;
    font-size: 13px;
    border: none;
    border-radius: 6px;
    background: #1a73e8;
    color: white;
    cursor: pointer;
  }
  button:disabled {
    background: #9aa0a6;
    cursor: default;
  }
  #copyBtn {
    background: #34a853;
    margin-top: 8px;
    display: none;
  }
  #cancelBtn {
    display: none;
    margin-top: 8px;
    background: transparent;
    color: light-dark(#c5221f, #f28b82);
    border: 1px solid currentColor;
  }
  #cancelBtn:disabled {
    background: transparent;
    color: #9aa0a6;
  }
  #status {
    font-size: 12px;
    color: #555;
    margin: 8px 0;
    min-height: 16px;
  }
  #warning {
    display: none;
    font-size: 12px;
    padding: 6px 8px;
    margin: 0 0 8px;
    border-radius: 6px;
    background: light-dark(#fef3e0, #3a2f1a);
    color: light-dark(#8a5300, #fdd663);
    border: 1px solid light-dark(#f0c987, #6b5b2e);
  }
  #output {
    flex: 1 1 auto;
    width: 100%;
    box-sizing: border-box;
    min-height: 160px;
    overflow-y: auto;
    padding: 8px;
    font-size: 13px;
    line-height: 1.4;
    border: 1px solid #ccc;
    border-radius: 6px;
    white-space: pre-wrap;
    background: rgba(0,0,0,0.02);
  }
  body.popup #output {
    max-height: 320px;
  }
</style>
</head>
<body>
  <h1>Distila</h1>

  <div class="row">
    <select id="typeSelect">
      <option value="key-points" selected>Key points</option>
      <option value="tldr">TL;DR</option>
    </select>
    <select id="lengthSelect">
      <option value="short" selected>Short</option>
      <option value="medium">Medium</option>
      <option value="long">Long</option>
    </select>
    <select id="formatSelect">
      <option value="markdown" selected>Markdown</option>
      <option value="plain-text">Plain text</option>
    </select>
  </div>

  <button id="summarizeBtn">Summarize article</button>
  <button id="cancelBtn">Cancel</button>
  <div id="status" aria-live="polite"></div>
  <div id="warning"></div>
  <div id="output"></div>
  <button id="copyBtn">Copy summary</button>

  <script src="common.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
