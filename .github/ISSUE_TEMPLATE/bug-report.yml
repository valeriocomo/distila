name: Bug report
description: Report something that isn't working as expected
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: chrome-version
    attributes:
      label: Chrome version
      description: Found at chrome://version
      placeholder: e.g. 128.0.6613.84
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: Found at chrome://extensions (with Developer mode on)
      placeholder: e.g. 1.1.0
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Screenshots, console errors, or anything else that might help.
    validations:
      required: false

  - type: checkboxes
    id: existing-issue-check
    attributes:
      label: Is there an existing issue for this?
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true
